services:
  backend_blue:
    build: .
    container_name: backend_blue
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_COLOR=blue
    # ports:
    #   - "8000:8000"
    depends_on:
      - db
    # This is for local development with hot reload, no need in production
    # volumes:
    #   - ./app:/app/app
    #   - ./alembic:/app/alembic

    command: >
             gunicorn -k uvicorn.workers.UvicornWorker app.main:app
             --bind 0.0.0.0:8000 --workers 3 --timeout 60
             --access-logfil=-
             --error-logfile=-

  backend_green:
    build: .
    container_name: backend_green
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_COLOR=green
    depends_on:
      - db
    command: >
             gunicorn -k uvicorn.workers.UvicornWorker app.main:app
             --bind 0.0.0.0:8000 --workers 3 --timeout 60
             --access-logfil=-
             --error-logfile=-

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend_blue
      - backend_green

  db:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-backend_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build: .
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/backend_db
    command: alembic upgrade head
    depends_on:
      - db

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend_blue
      - backend_green

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
